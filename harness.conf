# harness.conf — this kit gating ITSELF (also serves as a worked example).
# A fresh project gets its own via scripts/init.sh; see harness.conf.example for every option.

HARNESS_DOC_DIRS="running-files ci"
HARNESS_DOC_INDEX=""                      # the kit has no doc index; README is the map
# The kit is a shell project; it declares a stack like any project using it. `generic` is the
# language-neutral union — see scripts/stacks/README.md. Overrides below win over the pack.
HARNESS_STACK="generic"
HARNESS_CODE_DIRS="scripts"
HARNESS_CODE_EXTS="sh"
HARNESS_DECISION_DIR="running-files/adr"
HARNESS_DECISION_PREFIX="ADR"
HARNESS_BUG_REGISTER="running-files/tickets/bug-register.md"
HARNESS_MARKERS="DEFERRED-TEST:running-files/deferred-test-registry.md"
HARNESS_SECRET_TERMS="password secret token apikey api_key privatekey"
HARNESS_LOG_FUNCS="printf echo"   # overrides the pack: these are shell's log calls
HARNESS_BASELINE_DIR=".harness/baselines"
HARNESS_BASE_REF="origin/master"
# Platform-layer additions (2026-09-29). The kit's own onboarding template gates itself like a project.
HARNESS_ONBOARDING="running-files/ONBOARDING.md"
HARNESS_ONB_LOG_HEADING="## 8."
HARNESS_ONB_NEXT_HEADING="## 6."
HARNESS_LOG_DIR=".harness-logs"
HARNESS_SECOND_OPINION="local"   # the kit itself uses no outside model
# The kit's own files ARE this project: nothing is listed "last" by scripts/find.sh here.
HARNESS_FIND_LAST=""
