# harness.conf — this kit gating ITSELF (also serves as a worked example).
# A fresh project gets its own via scripts/init.sh; see harness.conf.example for every option.

HARNESS_DOC_DIRS="running-files sops ci"
HARNESS_DOC_INDEX=""                      # the kit has no doc index; README is the map
HARNESS_CODE_DIRS="scripts"
HARNESS_CODE_EXTS="sh"
HARNESS_DECISION_DIR="running-files/adr"
HARNESS_DECISION_PREFIX="ADR"
HARNESS_BUG_REGISTER="running-files/tickets/bug-register.md"
HARNESS_MARKERS="DEFERRED-TEST:running-files/deferred-test-registry.md"
HARNESS_SECRET_TERMS="password secret token apikey api_key privatekey"
HARNESS_LOG_FUNCS="printf echo"
HARNESS_BASELINE_DIR=".harness/baselines"
HARNESS_BASE_REF="origin/master"
