# stacks/go.conf — Go
HARNESS_CODE_EXTS="go"

# Matches both plain functions and methods with a receiver. The generic union misses every
# receiver method, which on a Go codebase is most of the interesting code.
HARNESS_DECL_RE='^[[:space:]]*func[[:space:]]+(\([^)]*\)[[:space:]]*)?[A-Za-z_][A-Za-z0-9_]*'
HARNESS_DECL_STRIP_RE='s/^[[:space:]]*func[[:space:]]+(\([^)]*\)[[:space:]]*)?//'
HARNESS_COMMENT_RE='^([[:space:]]*)(//|/\*|\*)'
HARNESS_DOC_BELOW=0

HARNESS_TEST_GLOBS='*_test.go'
HARNESS_SKIP_RE='(\.Skip\(|\.Skipf\(|\.SkipNow\()'
HARNESS_ERROR_RE='(err[[:space:]]*!=[[:space:]]*nil|err[[:space:]]*==[[:space:]]*nil|!ok\b|\berr\b|panic|Fatal)'
HARNESS_EXCLUDE_GLOBS='*/vendor/* */testdata/* *.pb.go *_generated.go *_gen.go *_string.go'

HARNESS_LOG_FUNCS="log print panic fatal"

HARNESS_TEST_CMD="go test ./..."
HARNESS_COVERAGE_CMD="go test -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -1"
HARNESS_LINT_CMD="go vet ./..."

HARNESS_FIX_SRC_NAME="app.go"
HARNESS_FIX_TEST_NAME="app_test.go"
HARNESS_FIX_GOOD='package app\n\n// Guard rejects empty input so callers cannot construct an unnamed record.\n// ADR-001 §3 — we fail closed rather than defaulting; a default here is unauditable.\nfunc Guard(s string) bool {\n\t// DEFERRED-TEST: provider round-trip, blocked on the provider sandbox\n\treturn s != ""\n}\n'
HARNESS_FIX_TEST='package app\n\n// TestGuard pins the ADR-001 §3 fail-closed behaviour.\nfunc TestGuard(t *testing.T) {\n\tif !Guard("x") {\n\t\tt.Fatal("expected true")\n\t}\n}\n'
HARNESS_FIX_UNCITED='package app\n\nfunc Undocumented(x int) int {\n\treturn x * 2\n}\n'
HARNESS_FIX_MARKER='package app\n\n// Helper does a thing.\n// ADR-001 §3 — why it exists.\nfunc Helper() {\n\t// DEFERRED-TEST: unregistered on purpose\n}\n'
HARNESS_FIX_SKIP='\nfunc TestSetup(t *testing.T) {\n\tdb, err := open()\n\tif err != nil {\n\t\tt.Skip("no db")\n\t}\n\t_ = db\n}\n'
HARNESS_FIX_LOG='\n// Login records the attempt.\n// ADR-001 §3 — why it exists.\nfunc Login(password string) {\n\tlog.Printf("attempt with password=%%s", password)\n}\n'
