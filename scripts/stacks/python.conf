# stacks/python.conf — Python
HARNESS_CODE_EXTS="py pyi"

HARNESS_DECL_RE='^[[:space:]]*(async[[:space:]]+)?def[[:space:]]+[A-Za-z_][A-Za-z0-9_]*'
HARNESS_DECL_STRIP_RE='s/^[[:space:]]*(async[[:space:]]+)?def[[:space:]]+//'
HARNESS_COMMENT_RE='^([[:space:]]*)(#|"""|'"'''"'|r"""|f""")'

# ⚠ THE ONE THAT ACTUALLY MATTERS HERE. Python documents a function with a docstring on the line
# AFTER the `def`, not a comment block above it. A gate hardcoded to look upward reports every
# Python function as undocumented — a uniform, confident, completely wrong result, and the kind
# that gets a gate muted in week one rather than fixed.
HARNESS_DOC_BELOW=1

HARNESS_TEST_GLOBS='test_*.py *_test.py */tests/* */test/*'
HARNESS_SKIP_RE='(pytest\.skip\(|self\.skipTest\(|@pytest\.mark\.skip|@unittest\.skip|raise SkipTest)'
HARNESS_ERROR_RE='(except|\berr\b|\berror\b|Exception|raise|failed|Failed|OSError|RuntimeError)'
HARNESS_EXCLUDE_GLOBS='*/.venv/* */venv/* */site-packages/* */__pycache__/* */build/* */.tox/* *_pb2.py'

HARNESS_LOG_FUNCS="log print debug info warn warning error critical exception"

HARNESS_TEST_CMD="pytest -q"
HARNESS_COVERAGE_CMD="pytest --cov --cov-report=term-missing"
HARNESS_LINT_CMD="ruff check ."

HARNESS_FIX_SRC_NAME="app.py"
HARNESS_FIX_TEST_NAME="test_app.py"
HARNESS_FIX_GOOD='def guard(s):\n    """Reject empty input so callers cannot construct an unnamed record.\n\n    ADR-001 §3 — we fail closed rather than defaulting; a default here is unauditable.\n    """\n    # DEFERRED-TEST: provider round-trip, blocked on the provider sandbox\n    return s != ""\n'
HARNESS_FIX_TEST='def test_guard():\n    """Pins the ADR-001 §3 fail-closed behaviour."""\n    assert guard("x")\n'
HARNESS_FIX_UNCITED='def undocumented(x):\n    return x * 2\n'
HARNESS_FIX_MARKER='def helper():\n    """Do a thing.\n\n    ADR-001 §3 — why it exists.\n    """\n    # DEFERRED-TEST: unregistered on purpose\n    return None\n'
HARNESS_FIX_SKIP='\ndef test_setup():\n    """Set up the db. ADR-001 §3."""\n    try:\n        db = open_db()\n    except OSError:\n        pytest.skip("no db")\n'
HARNESS_FIX_LOG='\ndef login(password):\n    """Record the attempt.\n\n    ADR-001 §3 — why it exists.\n    """\n    log.error("attempt with password=%%s", password)\n'
