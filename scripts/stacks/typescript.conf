# stacks/typescript.conf — TypeScript / JavaScript
HARNESS_CODE_EXTS="ts tsx js jsx mts cts"

# Two declaration shapes, because TS uses both: `function f()` and `const f = () =>`. A pack that
# only knows `function` silently exempts every arrow-function module in the codebase.
HARNESS_DECL_RE='^[[:space:]]*(export[[:space:]]+)?(default[[:space:]]+)?((async[[:space:]]+)?function[[:space:]]+[A-Za-z_$][A-Za-z0-9_$]*|(const|let|var)[[:space:]]+[A-Za-z_$][A-Za-z0-9_$]*[[:space:]]*(:[^=]*)?=[[:space:]]*(async[[:space:]]+)?(\([^)]*\)|[A-Za-z_$][A-Za-z0-9_$]*)[[:space:]]*(:[^=]*)?=>)'
HARNESS_DECL_STRIP_RE='s/^[[:space:]]*(export[[:space:]]+)?(default[[:space:]]+)?(async[[:space:]]+)?(function|const|let|var)[[:space:]]+//'
HARNESS_COMMENT_RE='^([[:space:]]*)(//|/\*|\*)'
HARNESS_DOC_BELOW=0

HARNESS_TEST_GLOBS='*.test.ts *.test.tsx *.test.js *.test.jsx *.spec.ts *.spec.tsx *.spec.js */__tests__/*'
HARNESS_SKIP_RE='(\bit\.skip\(|\btest\.skip\(|\bdescribe\.skip\(|\bxit\(|\bxdescribe\(|\bxtest\(|\.skip\()'
HARNESS_ERROR_RE='(catch|\berr\b|\berror\b|Error\b|rejected|failed|Failed|instanceof Error)'
HARNESS_EXCLUDE_GLOBS='*/node_modules/* */dist/* */build/* */.next/* */coverage/* *.d.ts *.generated.ts'

HARNESS_LOG_FUNCS="log warn error info debug trace"

HARNESS_TEST_CMD="npm test --silent"
HARNESS_COVERAGE_CMD="npx vitest run --coverage"
HARNESS_LINT_CMD="npx eslint ."

HARNESS_FIX_SRC_NAME="app.ts"
HARNESS_FIX_TEST_NAME="app.test.ts"
HARNESS_FIX_GOOD='// Guard rejects empty input so callers cannot construct an unnamed record.\n// ADR-001 §3 — we fail closed rather than defaulting; a default here is unauditable.\nexport function Guard(s: string): boolean {\n  // DEFERRED-TEST: provider round-trip, blocked on the provider sandbox\n  return s !== "";\n}\n'
HARNESS_FIX_TEST='// TestGuard pins the ADR-001 §3 fail-closed behaviour.\nexport function TestGuard(): void {\n  if (!Guard("x")) throw new Error("expected true");\n}\n'
HARNESS_FIX_UNCITED='export function Undocumented(x: number): number {\n  return x * 2;\n}\n'
HARNESS_FIX_MARKER='// Helper does a thing.\n// ADR-001 §3 — why it exists.\nexport function Helper(): void {\n  // DEFERRED-TEST: unregistered on purpose\n}\n'
HARNESS_FIX_SKIP='\nexport function TestSetup(): void {\n  const err = open();\n  if (err) {\n    it.skip("no db");\n  }\n}\n'
HARNESS_FIX_LOG='\n// Login records the attempt.\n// ADR-001 §3 — why it exists.\nexport function Login(password: string): void {\n  console.error("attempt with password=" + password);\n}\n'
