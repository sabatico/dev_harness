# stacks/generic.conf — the language-NEUTRAL default.
#
# This pack is the union: it matches the common shapes across C-family and Python-family syntax and
# is therefore loose. It exists so a fresh clone works before you have configured anything, NOT
# because it is good enough. Adopt a real pack in your first act — see stacks/README.md.
#
# Known looseness, stated rather than hidden: it misses methods with receivers or explicit `self`
# in the declaration line, misses languages whose functions are assignments (`x = () => {}`), and
# its error vocabulary is broad enough to over-flag. Each of those is exact in a language pack.

HARNESS_CODE_EXTS="go ts tsx js jsx rs py java rb kt swift cs php scala ex exs"

HARNESS_DECL_RE='^[[:space:]]*(export[[:space:]]+)?(public[[:space:]]+|private[[:space:]]+|pub[[:space:]]+)?(static[[:space:]]+)?(async[[:space:]]+)?(func|def|fn|function|sub|method)[[:space:]]+[A-Za-z_][A-Za-z0-9_]*'
HARNESS_DECL_STRIP_RE='s/^[[:space:]]*(export[[:space:]]+)?(public[[:space:]]+|private[[:space:]]+|pub[[:space:]]+)?(static[[:space:]]+)?(async[[:space:]]+)?(func|def|fn|function|sub|method)[[:space:]]+//'
HARNESS_COMMENT_RE='^([[:space:]]*)(//|#|--|;|%|\*|/\*|"""|'"'''"')'

HARNESS_TEST_GLOBS='*_test.* *_tests.* *.test.* *.spec.* *_spec.* */test_* */tests_* */tests/* */test/* */__tests__/* */spec/*'
HARNESS_SKIP_RE='(\.[Ss]kip[A-Za-z]*\(|\bskip[A-Z][A-Za-z]*\(|\bskip\(|@unittest\.skip|@pytest\.mark\.skip)'
HARNESS_ERROR_RE='(err[[:space:]]*!=[[:space:]]*nil|err[[:space:]]*==[[:space:]]*nil|!ok\b|catch|except|rescue|\berr\b|\berror\b|Exception|panic|failed|Failed)'
HARNESS_EXCLUDE_GLOBS='*/vendor/* */node_modules/* */third_party/* */.venv/* */site-packages/* */dist/* */build/* */target/* *_generated.* *.gen.* *.pb.* *_pb2.* *.min.js'

HARNESS_LOG_FUNCS="log logf print println printf debug info warn error fatal trace"

# ⚠ No runner is guessed. Empty means the suite reports NOT RUN — a gap, never a pass.
HARNESS_TEST_CMD=""
HARNESS_COVERAGE_CMD=""
HARNESS_LINT_CMD=""

# ── self-test fixture (printf format strings; see stacks/README.md) ──────────
HARNESS_FIX_SRC_NAME="app.src"
HARNESS_FIX_TEST_NAME="app_test.src"
HARNESS_FIX_GOOD='// Guard rejects empty input so callers cannot construct an unnamed record.\n// ADR-001 §3 — we fail closed rather than defaulting; a default here is unauditable.\nfunction Guard(s) {\n  // DEFERRED-TEST: provider round-trip, blocked on the provider sandbox\n  return s != "";\n}\n'
HARNESS_FIX_TEST='// TestGuard pins the ADR-001 §3 fail-closed behaviour.\nfunction TestGuard() {\n  assert(Guard("x"));\n}\n'
HARNESS_FIX_UNCITED='function Undocumented(x) {\n  return x * 2;\n}\n'
HARNESS_FIX_MARKER='// Helper does a thing.\n// ADR-001 §3 — why it exists.\nfunction Helper() {\n  // DEFERRED-TEST: unregistered on purpose\n}\n'
HARNESS_FIX_SKIP='\nfunction TestSetup() {\n  const err = open();\n  if (err) {\n    this.skip("no db");\n  }\n}\n'
HARNESS_FIX_LOG='\n// Login records the attempt.\n// ADR-001 §3 — why it exists.\nfunction Login(password) {\n  log.error("attempt with password=" + password);\n}\n'
